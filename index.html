<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<meta name="description" content="A solo play aid for the Plot Unfolding Machine and Scene Unfolding Machine.">
<title>Unfolding Machines</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#screen">Skip to content</a>

  <header class="app-header" id="app-header">
    <button class="hdr-btn" id="btn-home" aria-label="Home" title="Home">
      <span aria-hidden="true">◈</span>
    </button>
    <div class="brand">
      <span class="brand-name">Unfolding Machines</span>
      <span class="brand-sub" id="brand-sub">PUM v9 · SUM v8</span>
    </div>
    <!-- Persistent plot header: the game's Threshold, visible on every in-play
         screen. It takes the brand's place in the one sticky bar rather than
         stacking a second bar under it. -->
    <div class="plot-header" id="plot-header" hidden></div>
    <button class="hdr-btn" id="btn-theme" aria-label="Switch theme" title="Switch theme">
      <span aria-hidden="true">◐</span>
    </button>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <div class="action-bar-mount" id="action-bar"></div>

  <nav class="tab-bar" id="tab-bar" aria-label="Main"></nav>

  <div id="toast-mount" class="toast-mount" aria-live="polite" aria-atomic="true"></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-mount"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
